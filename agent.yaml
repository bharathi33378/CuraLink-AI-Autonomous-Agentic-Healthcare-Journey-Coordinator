spec_version: "0.1.0"
name: curalink-ai
version: "2.0.0"
description: "Autonomous Agentic Healthcare Journey Coordinator for Elderly Patients with 6-Language Multilingual Voice and Clinical Triage"

model:
  preferred: gemini-1.5-flash
  fallback:
    - claude-3-5-sonnet

compliance:
  risk_tier: high
  frameworks: [hipaa, finra]
  supervision:
    human_in_the_loop: always
    kill_switch: true
  recordkeeping:
    audit_logging: true
    retention_period: 7y
    immutable: true
  model_risk:
    validation_cadence: quarterly
    ongoing_monitoring: true
  segregation_of_duties:
    roles:
      - id: triage_agent
        description: "Patient intake and journey proposal creation"
        permissions: [create, submit]
      - id: doctor_copilot
        description: "Clinical evaluation and prescription authorization"
        permissions: [review, approve, reject]
    conflicts:
      - [triage_agent, doctor_copilot]
    assignments:
      curalink_ai: [triage_agent]
      doctor_copilot: [doctor_copilot]
    handoffs:
      - action: prescription_authorization
        required_roles: [triage_agent, doctor_copilot]
        approval_required: true
    enforcement: strict
